services:
  maquina00:
    build: ./
    tty: true
    volumes:
      - /home/maquina00/home/root:/home/root
      - /home/maquina00/home/user:/home/user
    networks:
      - red00
    ports:
      - '10800:80' # HTTP
      - '14430:443' # HTTPS
      - '10210:21' # FTP
      - '19900:990' # FTPS
      - '10220:22' # SSH
      - '10070:7' # UDP
  maquina01:
    build: ./
    tty: true
    volumes:
      - /home/maquina01/home/root:/home/root
      - /home/maquina01/home/user:/home/user
    networks:
      - red00
    ports:
      - '10801:80' # HTTP
      - '14431:443' # HTTPS
      - '10211:21' # FTP
      - '19901:990' # FTPS
      - '10221:22' # SSH
      - '10071:7' # UDP
networks:
  red00: 
    driver: bridge
    external: false